<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Deep obsidian space canvas -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#030712" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Metallic bevel border -->
    <linearGradient id="bevelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Ultra high-energy neon lightning beam -->
    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="35%" stop-color="#4f46e5" />
      <stop offset="70%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Intense glow filter -->
    <filter id="hyperGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.2" result="blur1" />
      <feGaussianBlur stdDeviation="4" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Hexagonal / Squircle Cyber Shield -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#shieldGrad)" stroke="url(#bevelGrad)" stroke-width="2.5" />

  <!-- Background radial subtle flare -->
  <circle cx="32" cy="32" r="18" fill="#4f46e5" opacity="0.18" />

  <!-- Ambient SRE Pulse Activity Line -->
  <path
    d="M8 32h9l4.5-12 8 24 7-18 4.5 10 3-4h18"
    stroke="url(#beamGrad)"
    stroke-width="4.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#hyperGlow)"
  />

  <!-- Apex Live Telemetry Spark / AI Core -->
  <circle cx="31.5" cy="44" r="3.5" fill="#22d3ee" filter="url(#hyperGlow)" />
  <circle cx="31.5" cy="44" r="1.5" fill="#ffffff" />

  <!-- Top Right 24/7 Healthy Status Indicator -->
  <circle cx="53" cy="11" r="3" fill="#10b981" />
  <circle cx="53" cy="11" r="5" stroke="#10b981" stroke-width="1.2" opacity="0.5" />
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="zapBg" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="zapShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#4f46e5" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Gradient Rounded Badge (rounded-xl) -->
  <rect width="32" height="32" rx="9" fill="url(#zapBg)" filter="url(#zapShadow)" />

  <!-- Lucide Zap Lightning Bolt in Pure White -->
  <g transform="translate(4, 4) scale(1)">
    <polygon
      points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"
      fill="#ffffff"
      stroke="#ffffff"
      stroke-width="1.2"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>
</svg>
